deployAs:
  - name: connect-service
    applicationType: service
    endpoint: /service
    configuration:
      standardConfiguration:
        - key: CUSTOM_APPLICATION_CONFIGURATION_URL
          description: Custom Applications → Configure Custom Applications → your application → Configuration → copy the browser URL.
          required: true
        - key: ENTRY_POINT_URI_PATH
          description: Custom Applications → Configure Custom Applications → your application → Application entry point URI path.
          required: true
    scripts:
      postDeploy: npm run connector:post-deploy
      preUndeploy: npm run connector:pre-undeploy
inheritAs:
  apiClient:
    scopes:
      - view_project_settings
      - view_orders
      - view_payments
      - view_connectors_deployments
      - view_connectors
