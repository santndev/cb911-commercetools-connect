deployAs:
  - name: connect-service
    applicationType: service
    endpoint: /service
    configuration:
      standardConfiguration:
        - key: CUSTOM_APPLICATION_ID
          description: 'Application URL to copy: https://apps.chargebacks911.com/api/platforms/commercetools/marketplace — Merchant Center → Manage organizations & teams → your organization → Custom Applications → Configure Custom Applications → Add a Custom Application → Application URL. Select view_project_settings in the default View permissions. Save → Application ID → Copy.'
          required: true
        - key: ENTRY_POINT_URI_PATH
          description: Custom Applications → Configure Custom Applications → your application → Application entry point URI path.
          required: true
    scripts:
      postDeploy: npm run connector:post-deploy
      preUndeploy: npm run connector:pre-undeploy
inheritAs:
  apiClient:
    scopes:
      - view_project_settings
      - view_orders
      - view_payments
      - view_connectors_deployments
      - view_connectors
