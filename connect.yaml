deployAs:
  - name: connect-service
    applicationType: service
    endpoint: /service
    scripts:
      postDeploy: npm run connector:post-deploy
      preUndeploy: npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CB911_LIFECYCLE_URL
          description: 'Developer preview only: HTTPS lifecycle endpoint operated by Chargebacks911. Never request this from a customer.'
          required: true
inheritAs:
  apiClient:
    scopes:
      - view_project_settings
      - view_orders
      - view_payments
      - view_connectors_deployments
